prefix: "&#0055ff&l⚡ &#00E5FF&lMIR-TIME &8» "

# ==========================================================
# 1. НАСТРОЙКА ТОЧКИ СПАВНА БОССОВ
# Вы можете вписать мир и координаты здесь вручную ИЛИ просто
# встать в нужное место в игре и написать /boss setspawn
# ==========================================================
spawn:
  world: "game"
  x: -192.5
  y: 74.0
  z: 103.5

# ==========================================================
# 2. ОБЩИЕ ПРАВИЛА ИВЕНТА
# ==========================================================
# Как часто появляется новый босс (в минутах)
spawn-interval-minutes: 60

# Сколько минимум игроков должно быть на сервере для авто-спавна
min-online: 2

# Через сколько секунд без ударов босс исчезнет сам (без наград)
idle-despawn-seconds: 60

# ==========================================================
# 3. НАСТРОЙКА БОССОВ (имена, здоровье, урон и награды)
# Можно свободно менять любые названия, цифры HP и команды наград!
# После изменений напишите в игре: /boss reload
# ==========================================================
bosses:
  spider:
    name: "&#00FF66&l🕷 Королева Пауков"
    type: "SPIDER"
    health: 1000.0
    damage: 14.0
    bar-color: "GREEN"
    rewards:
      top1: ["eco give %player% 40000", "p give %player% 300"]
      top2: ["eco give %player% 20000", "p give %player% 150"]
